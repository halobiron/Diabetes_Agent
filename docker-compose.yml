version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_TOKEN: ${API_TOKEN:-dev-token}
      REQUIRE_API_TOKEN: ${REQUIRE_API_TOKEN:-false}
      LOG_DIR: /app/logs
      MODEL_ARTIFACT_PATH: /app/artifacts/risk_model.joblib
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j}
      # Chỉ cho demo: cho phép mật khẩu ngắn hơn 8 ký tự (mặc định của Neo4j 5).
      NEO4J_dbms_security_auth__minimum__password__length: "1"
    volumes:
      - neo4j_data:/data

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-dev-token}
    depends_on:
      - api

volumes:
  neo4j_data:
